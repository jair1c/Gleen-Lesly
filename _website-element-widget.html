<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirmación RSVP</title>
  <link rel="stylesheet" href="assets/demo3/css/demo3-enhancements.css?v=20260929">
  <style>
    :root{--ink:#5b5232;--paper:#f4f0e8;--line:#b9ad98;--ok:#667455;--error:#665638}
    *{box-sizing:border-box}
    html,body{overflow:hidden}
    body{margin:0;padding:12px;color:var(--ink);background:transparent;font-family:"Demo3 Text",Georgia,serif}
    .card{position:relative;isolation:isolate;overflow:hidden;padding:28px 26px 30px;color:#fffaf2;background:#171310;border:1px solid rgba(255,250,242,.25);box-shadow:0 9px 24px rgba(18,10,6,.2)}
    .card::before{content:"";position:absolute;inset:-18px;z-index:-1;pointer-events:none;background:url("assets/demo3/media/gleen-lesly-detalles.jpg") center 38% / cover no-repeat;filter:blur(8px) brightness(.52)}
    .card .eyebrow,.card .title,.card label,.card .hint,.card .saved{text-shadow:0 1px 8px rgba(18,10,6,.42)}
    .eyebrow{text-align:center;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
    .title{margin:8px 0 12px;text-align:center;font:italic 400 43px/1.05 "Demo3 Serif",Georgia,serif}
    .subtitle{margin:0 auto 22px;max-width:38ch;text-align:center;font-size:15px;line-height:1.55}
    .summary{margin:0 0 18px;padding:14px 16px;text-align:center;background:rgba(23,19,16,.4);border:1px solid rgba(255,250,242,.25);font-size:14px;line-height:1.5}
    .summary strong{display:block;font-size:18px}
    .field{margin-top:15px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    label{display:block;margin-bottom:7px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    input,select,textarea{width:100%;min-height:50px;padding:14px;color:#433c28;background:#fffdf9;border:1px solid var(--line);border-radius:0;font:16px/1.35 "Demo3 Text",Georgia,serif}
    input[readonly]{color:#5b5232;background:#eee9df}
    input:disabled,select:disabled{color:#766f5c;background:#eee9df;opacity:.78;cursor:not-allowed}
    textarea{min-height:88px;resize:vertical}
    .attendees{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .attendees .field{margin-top:12px}
    .form-section{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,250,242,.3)}
    .hint{margin:0 0 10px;font-size:14px;line-height:1.45}
    #attendeeSection.hidden{display:none!important}
    .submit{width:100%;min-height:56px;margin-top:20px;padding:15px 18px;color:#46513d;background:#fff1c9;border:1px solid #d6d9bc;font:700 11px/1.3 "Demo3 Text",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
    .submit:disabled{opacity:.55;cursor:wait}
    .alert{display:none;margin-top:14px;padding:12px;text-align:center;font-size:14px;line-height:1.45}
    .alert.success{display:block;color:#fff;background:var(--ok)}
    .alert.error{display:block;color:#fff;background:var(--error)}
    .saved{margin-top:11px;text-align:center;font-size:13px;font-style:italic}
    .hidden{display:none!important}
    @media(max-width:640px){.card::before{background-position:48% center}}
    @media(max-width:430px){body{padding:8px}.card{padding:23px 18px 26px}.row,.attendees{grid-template-columns:1fr}.title{font-size:38px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Confirma tu asistencia</div>
    <h1 class="title">¿Celebramos juntos?</h1>
    <div class="summary hidden" id="inviteSummary"><span>Invitación para</span><strong id="summaryName"></strong><span id="summarySeats"></span></div>
    <form id="rsvpForm" novalidate>
      <div class="field form-section"><label for="attendance">¿Serás parte de este día?</label><select id="attendance" required><option value="" selected disabled>Selecciona</option><option value="si">Síí, ¡felices de ser parte!</option><option value="no">No, celebramos a la distancia</option></select></div>
      <div class="field form-section" id="peopleWrap"><label for="people">N.º de asistentes</label><p class="hint">Selecciona cuántos asistirán</p><select id="people" disabled><option value="1">1 persona</option></select></div>
      <div id="attendeeSection" class="field hidden"><label>Nombres de los asistentes</label><p class="hint">Indica el nombre completo de cada persona</p><div class="attendees" id="attendeeFields"></div></div>
      <div class="field form-section"><label for="message">Tus palabras, para siempre</label><textarea id="message" maxlength="500" placeholder="Unas palabras para los novios…"></textarea></div>
      <button class="submit" id="submitButton" type="submit">Guardar y confirmar por WhatsApp</button>
      <div class="alert" id="alertBox" role="status"></div><div class="saved hidden" id="savedNote">Puedes actualizar tu respuesta hasta la fecha límite.</div>
    </form>
  </main>
  <script>
    const form=document.getElementById('rsvpForm'),attendance=document.getElementById('attendance'),people=document.getElementById('people'),fields=document.getElementById('attendeeFields'),messageInput=document.getElementById('message'),submitButton=document.getElementById('submitButton'),alertBox=document.getElementById('alertBox'),card=document.querySelector('.card');let invitation=null,resizeFrame=0;
    function reportHeight(){cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{const height=Math.ceil(card.getBoundingClientRect().height+24);window.parent.postMessage({type:'demo3:rsvp-height',height},location.origin)})}
    function alertMessage(text,error=false){alertBox.textContent=text;alertBox.className='alert '+(error?'error':'success')}
    function parentToken(){const ownToken=new URLSearchParams(location.search).get('invite');if(ownToken)return ownToken;try{return new URLSearchParams(window.parent.location.search).get('invite')||window.parent.demo2InviteToken||''}catch(_){return ''}}
    function setPeopleOptions(max,selected){people.innerHTML='';for(let count=1;count<=max;count++){const option=document.createElement('option');option.value=String(count);option.textContent=count+(count===1?' persona':' personas');people.appendChild(option)}people.value=String(Math.min(Math.max(Number(selected)||1,1),max))}
    function isFamilyInvitation(){return /^familia\b/i.test((invitation&&(invitation.names||invitation.nombre)||'').trim())}
    function renderAttendees(existing=[]){
      fields.innerHTML='';
      const enabled=attendance.value==='si',count=Number(people.value)||1,family=isFamilyInvitation(),first=0;
      fields.classList.toggle('hidden',!enabled||count<=first);
      document.getElementById('attendeeSection').classList.toggle('hidden',!enabled||count<=first);
      for(let index=first;index<count;index++){
        const group=document.createElement('div');group.className='field';
        const label=document.createElement('label');label.htmlFor='attendee-'+index;
        label.textContent=`Nombre del asistente ${index+1}`;
        const input=document.createElement('input');input.id='attendee-'+index;input.className='attendee-name';input.maxLength=120;input.required=enabled;input.disabled=!enabled;input.placeholder='Nombre y apellido';input.value=existing[index-first]||'';
        group.append(label,input);fields.appendChild(group);
      }
    }
    function savedAttendeeFields(names){
      if(!isFamilyInvitation())return names;
      const title=(invitation.names||invitation.nombre||'').trim();
      return names.length&&names[0].trim().toLowerCase()===title.toLowerCase()?names.slice(1):names;
    }
    function applyInvitation(value){invitation=value;if(!value)return;document.getElementById('summaryName').textContent=value.names||value.nombre||'';document.getElementById('summarySeats').textContent=`Hemos reservado ${value.seats} ${Number(value.seats)===1?'lugar':'lugares'} especialmente para ${Number(value.seats)===1?'ti':'ustedes'}.`;document.getElementById('inviteSummary').classList.remove('hidden');window.parent.postMessage({type:'demo3:invitation-loaded',exp:value.exp},location.origin);setPeopleOptions(Number(value.seats)||1,Number(value.seats)||1);const r=value.rsvp;if(r){attendance.value=r.attendance?'si':'no';setPeopleOptions(Number(value.seats)||1,r.attendeeCount||1);messageInput.value=r.message||'';renderAttendees(savedAttendeeFields(r.attendeeNames||[]));document.getElementById('savedNote').classList.remove('hidden')}else renderAttendees([]);toggleAttendance();if(value.expired||value.active===false){form.querySelectorAll('input,select,textarea').forEach(control=>control.disabled=true);submitButton.disabled=true;submitButton.textContent=value.expired?'Plazo de confirmación finalizado':'Invitación desactivada';alertMessage(value.expired?'El plazo para confirmar asistencia finalizó. Puedes seguir consultando los detalles de la invitación.':'Esta invitación fue desactivada.',true)}else{submitButton.disabled=false;submitButton.textContent='Guardar y confirmar por WhatsApp'}}
    function toggleAttendance(){const yes=attendance.value==='si';people.disabled=!yes;renderAttendees(Array.from(document.querySelectorAll('.attendee-name')).map(input=>input.value))}
    async function waitForInvitation(){submitButton.disabled=true;submitButton.textContent='Cargando invitación…';const token=parentToken();if(!token){alertMessage('Para confirmar tu asistencia, abre el enlace personalizado que recibiste.',true);submitButton.textContent='Enlace personalizado requerido';return}try{const response=await fetch('/api/invitation?token='+encodeURIComponent(token),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'No pudimos abrir esta invitación.');applyInvitation(data.invitation)}catch(error){alertMessage(error.message,true);submitButton.disabled=true;submitButton.textContent='No se pudo cargar la invitación'}}
    attendance.addEventListener('change',toggleAttendance);people.addEventListener('change',()=>renderAttendees(Array.from(document.querySelectorAll('.attendee-name')).map(input=>input.value)));
    form.addEventListener('submit',async event=>{event.preventDefault();const attending=attendance.value==='si',invitedName=(invitation&&(invitation.names||invitation.nombre)||'').trim(),companions=Array.from(document.querySelectorAll('.attendee-name')).map(input=>input.value.trim()),names=attending?companions:[];if(!invitedName)return alertMessage('No pudimos cargar el nombre de esta invitación.',true);if(!attendance.value)return alertMessage('Selecciona si asistirás.',true);if(attending&&names.some(name=>!name))return alertMessage('Completa el nombre de todas las personas que asistirán.',true);const token=parentToken();submitButton.disabled=true;submitButton.textContent='Guardando confirmación…';try{if(!token){throw new Error('Este es un enlace anterior. Solicita el nuevo enlace personalizado para registrar la confirmación en el panel.')}const response=await fetch('/api/invitation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,attendance:attending,attendeeCount:attending?Number(people.value):0,attendeeNames:names,message:messageInput.value.trim()})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'No pudimos guardar la confirmación.');alertMessage(data.whatsappUrl?'Confirmación guardada. Abriendo WhatsApp…':'Confirmación guardada. Falta configurar el número de WhatsApp.',!data.whatsappUrl);document.getElementById('savedNote').classList.remove('hidden');if(data.whatsappUrl)setTimeout(()=>{if(window.top&&window.top!==window.self)window.top.location.href=data.whatsappUrl;else window.location.href=data.whatsappUrl},650)}catch(error){alertMessage(error.message,true)}finally{submitButton.disabled=false;submitButton.textContent='Guardar y confirmar por WhatsApp'}});
    if(card&&window.ResizeObserver)new ResizeObserver(reportHeight).observe(card);
    window.addEventListener('load',reportHeight);reportHeight();waitForInvitation();
  </script>
</body>
</html>
